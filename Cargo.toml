[package]
name = "trout"
version = "0.1.0"
edition = "2024"
description = "Optimised LLM router: an OpenAI-compatible relay for metered client links"
publish = false

[lib]
name = "trout"
path = "src/lib.rs"

[[bin]]
name = "trout"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio"] }
bytes = "1"
flate2 = "1"
futures-util = "0.3"
http-body-util = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
