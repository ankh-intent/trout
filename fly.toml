# fly.toml app configuration file generated for trout on 2026-11-11T07:33:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trout'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  TROUT_CONFIG = '/etc/trout/trout.toml'
  TROUT_LISTEN = '0.0.0.0:8080'
  TROUT_STORE_PATH = '/data/trout.db'

[[mounts]]
  source = 'trout_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '3s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
